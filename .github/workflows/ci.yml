name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build all MCP servers
        run: npm run build

      - name: Unit tests
        run: npm test

      # One SFO-LAX round-trip, read-only. A Google IP block or markup change
      # should be visible in CI without making deterministic unit tests flaky.
      - name: Experimental selected-return Google live canary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/google-roundtrip-pair-selection-p1'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/smoke-google-roundtrip.mjs

      - name: Experimental one-stop outbound + two-adult basis canary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/google-connecting-outbound-pricing-p2'
        continue-on-error: true
        timeout-minutes: 4
        run: node scripts/smoke-google-connecting.mjs

      - name: Google itinerary review-link read-only canary
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/google-exact-itinerary-review-links-p3'
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/smoke-google-review-links.mjs
